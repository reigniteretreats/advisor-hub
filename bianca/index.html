<style>
html,body{margin:0;min-height:100%;background:#1A1A1A;font-family:'Raleway',Arial,sans-serif;color:#f3ece3}
.gate{min-height:100vh;display:grid;place-items:center;padding:24px;box-sizing:border-box}
.card{width:min(100%,380px);text-align:center}
.card img{height:56px;margin-bottom:22px}
.card h1{font-weight:300;font-size:28px;margin:0 0 6px;color:#fff}
.card p{color:#cbbfae;font-size:14px;margin:0 0 22px;line-height:1.5}
form{display:grid;gap:12px}
input[type=password]{font:inherit;font-size:16px;padding:14px 16px;border-radius:10px;border:1px solid #C59F73;background:#2a2622;color:#fff;outline:none}
input[type=password]:focus{box-shadow:0 0 0 3px rgba(197,159,115,.35)}
button{font:inherit;font-weight:600;font-size:15px;padding:14px;border:0;border-radius:10px;background:#C59F73;color:#1A1A1A;cursor:pointer}
label.keep{display:flex;gap:8px;align-items:center;justify-content:center;font-size:13px;color:#cbbfae}
.err{color:#e8a08f;font-size:13px;min-height:1.2em}
</style></head>

const KEY = 'rr-adv-bianca';
const b64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
async function unlock(pw) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64(PAYLOAD.salt), iterations: PAYLOAD.iter, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(PAYLOAD.iv) }, key, b64(PAYLOAD.data));
  return new TextDecoder().decode(plain);
}
function show(html) { document.open(); document.write(html); document.close(); }
async function tryPw(pw, remember) {
  try {
    const html = await unlock(pw);
    try { if (remember) localStorage.setItem(KEY, pw); else localStorage.removeItem(KEY); } catch (e) {}
    show(html);
  } catch (e) {
    try { localStorage.removeItem(KEY); } catch (_) {}
    document.getElementById('err').textContent = 'That password did not work. Please try again.';
  }
}
let saved = null; try { saved = localStorage.getItem(KEY); } catch (e) {}
if (saved) tryPw(saved, true);
document.getElementById('f').addEventListener('submit', (e) => { e.preventDefault(); tryPw(document.getElementById('pw').value, document.getElementById('keep').checked); });
